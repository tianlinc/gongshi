name: Build

# ============================================================
#  IEI Timer Faster 跨平台构建 CI
#  INSPUR-80: Windows + macOS 并行打包
#
#  触发方式:
#    - push tag v* (如 v1.0.0)
#    - 手动触发 (Actions 页面 → Run workflow)
#
#  产物 (下载路径: Actions → 选择运行 → Artifacts):
#    - Windows: IEI_Timer_Faster_Setup.exe (Inno Setup 安装包)
#    - macOS:   IEI_Timer_Faster_Setup.dmg (磁盘镜像)
# ============================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  # ==========================================================
  #  ISCC 编译检查 — 每次 push/PR 到 main 都跑
  #  只编译 setup.iss，不做 PyInstaller 打包，不上传 artifact
  #  编译失败直接阻断，用于在开发阶段尽早发现问题
  # ==========================================================
  check-iscc:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint setup.iss (brace GUID check)
        shell: bash
        run: |
          # Scan [Code] section for brace GUID patterns
          # The { } in Pascal comments/literals cause ISCC Syntax error.
          # Catch it early — no ISCC install needed for this scan.
          # INSPUR-95: 5 rounds of the same bug class, scan proactively.
          in_code=0
          line_num=0
          errors=0
          while IFS= read -r line; do
            line_num=$((line_num + 1))
            if [[ "$line" =~ ^\[Code\] ]]; then
              in_code=1
              continue
            fi
            if [[ "$line" =~ ^\[ && ! "$line" =~ ^\[Code\] ]]; then
              in_code=0
            fi
            if [ $in_code -eq 1 ] && echo "$line" | grep -qP '\{[A-Fa-f0-9]{8}-'; then
              # Exclude properly-escaped {{GUID}} in string literals (ISPP syntax)
              if echo "$line" | grep -qP '\{\{[A-Fa-f0-9]{8}-'; then
                : # skip — {{GUID}} is correct ISPP double-brace escaping
              else
                echo "  [X] Line $line_num: potential brace GUID in [Code] section"
                echo "      $line"
                errors=$((errors + 1))
              fi
            fi
          done < service_installer/installer/setup.iss
          if [ $errors -gt 0 ]; then
            echo ""
            echo "[X] Found $errors brace GUID issue(s) in [Code] Pascal context."
            echo "    Replace {GUID} -> [[GUID]] in comments, or {{GUID}} in string literals."
            exit 1
          fi
          echo "[OK] No brace GUID patterns in [Code] section."

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Compile setup.iss (ISCC syntax check)
        shell: cmd
        run: |
          set "ISCC="
          if exist "%LOCALAPPDATA%\Programs\Inno Setup 6\ISCC.exe" set "ISCC=%LOCALAPPDATA%\Programs\Inno Setup 6\ISCC.exe"
          if not defined ISCC if exist "%ProgramFiles%\Inno Setup 6\ISCC.exe" set "ISCC=%ProgramFiles%\Inno Setup 6\ISCC.exe"
          if not defined ISCC if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not defined ISCC (echo [X] ISCC not found & exit /b 1)
          echo [OK] ISCC: %ISCC%
          "%ISCC%" /O%RUNNER_TEMP% /Qp "service_installer\installer\setup.iss" || exit /b %errorlevel%
          echo [OK] ISCC compilation check passed

  # ==========================================================
  #  版本号校验 — tag push 前验证 VERSION 文件与 git tag 一致
  #  杜绝 v1.1.13 tag + v1.1.12 产物的事故（INSPUR-95）
  # ==========================================================
  verify-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION matches git tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Git tag:    v${TAG_VERSION}"
          echo "VERSION file: ${FILE_VERSION}"
          if [ "${TAG_VERSION}" != "${FILE_VERSION}" ]; then
            echo ""
            echo "[X] VERSION file (${FILE_VERSION}) does not match git tag (v${TAG_VERSION})"
            echo "    Update the VERSION file before pushing the tag."
            exit 1
          fi
          echo "[OK] VERSION file matches git tag: ${FILE_VERSION}"

  # ==========================================================
  #  Windows 构建 (仅 tag push 触发)
  # ==========================================================
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r service_installer/requirements.txt pyinstaller

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Install Chinese language for ISCC
        shell: cmd
        run: |
          for %%d in (
            "%LOCALAPPDATA%\Programs\Inno Setup 6"
            "%ProgramFiles%\Inno Setup 6"
            "C:\Program Files (x86)\Inno Setup 6"
          ) do if exist "%%~d\ISCC.exe" (
            curl -sSL -o "%%~d\Languages\ChineseSimplified.isl" "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
            echo [OK] Installed ChineseSimplified.isl to %%~d\Languages
            goto :done_isl
          )
          echo [X] Could not find Inno Setup to install language
          :done_isl

      - name: Build (PyInstaller)
        shell: cmd
        working-directory: service_installer
        run: |
          echo === Python check ===
          python --version
          echo === PyInstaller check ===
          python -m pip show pyinstaller
          if exist "dist\IEI Timer Faster" rmdir /s /q "dist\IEI Timer Faster"
          echo === Build start ===
          python -m PyInstaller --noconfirm service.spec || exit /b %errorlevel%
          echo === Build done ===
          if not exist "dist\IEI Timer Faster\IEI Timer Faster.exe" (
            echo [X] PyInstaller build failed: IEI Timer Faster.exe not found
            dir dist 2>nul || echo "(dist/ does not exist)"
            exit /b 1
          )

      # =========================================================
      #  INSPUR-103 模块3: 确定性构建验证
      #  对比两次 PyInstaller 构建的文件哈希，差异率 > 10%% 则阻断
      # =========================================================
      - name: Deterministic build verification
        shell: bash
        run: |
          DIST_DIR="service_installer/dist/IEI Timer Faster"
          BUILD_DIR="service_installer/build"
          TEMP_DIST="service_installer/dist_save"
          HASH_FILE_1="hash_v1.txt"
          HASH_FILE_2="hash_v2.txt"

          # Step 1: 第一次构建的哈希快照
          echo "[OK] Computing first build hash snapshot..."
          find "$DIST_DIR" -type f -exec sha256sum {} \; | sort > "$HASH_FILE_1"
          echo "  Total files: $(wc -l < $HASH_FILE_1)"

          # Step 2: 保存第一次 dist 到临时目录
          echo "[OK] Saving first build to temp..."
          rm -rf "$TEMP_DIST"
          mkdir -p "$TEMP_DIST"
          cp -r "$DIST_DIR" "$TEMP_DIST/"

          # Step 3: 清除并重新构建
          echo "[OK] Cleaning build artifacts..."
          rm -rf "$DIST_DIR" "$BUILD_DIR"
          echo "[OK] Rebuilding (second pass)..."
          cd service_installer
          python -m PyInstaller --noconfirm service.spec
          cd ..

          # Step 4: 第二次构建的哈希快照
          echo "[OK] Computing second build hash snapshot..."
          find "$DIST_DIR" -type f -exec sha256sum {} \; | sort > "$HASH_FILE_2"
          echo "  Total files: $(wc -l < $HASH_FILE_2)"

          # Step 5: 对比
          echo "[OK] Comparing builds..."
          DIFF_COUNT=$(comm -3 "$HASH_FILE_1" "$HASH_FILE_2" | wc -l)
          TOTAL=$(wc -l < "$HASH_FILE_1")
          if [ "$TOTAL" -eq 0 ]; then TOTAL=1; fi
          DIFF_PCT=$(( DIFF_COUNT * 100 / TOTAL ))
          echo "  Different files: $DIFF_COUNT / $TOTAL (${DIFF_PCT}%)"

          if [ "$DIFF_PCT" -gt 10 ]; then
            echo ""
            echo "[X] Build determinism FAILED: ${DIFF_PCT}%% files differ (threshold: 10%%)"
            echo "  Differences:"
            comm -3 "$HASH_FILE_1" "$HASH_FILE_2" | head -20
            # Restore first build for CI artifact upload (always want one installer)
            echo "  Restoring first build for installer packaging..."
            rm -rf "$DIST_DIR"
            cp -r "$TEMP_DIST/IEI Timer Faster" "$DIST_DIR"
            exit 1
          fi
          echo "[OK] Build determinism: OK (${DIFF_PCT}%%)"

          # Step 6: 恢复第一次构建用于后续 Inno Setup（保证用第一次构建产物）
          echo "[OK] Restoring first build for installer..."
          rm -rf "$DIST_DIR"
          cp -r "$TEMP_DIST/IEI Timer Faster" "$DIST_DIR"
          rm -rf "$TEMP_DIST"

      # =========================================================
      #  INSPUR-103 模块2: 生成 manifest.json（SHA256 文件清单）
      # =========================================================
      - name: Generate manifest.json
        id: manifest
        shell: bash
        run: |
          DIST_DIR="service_installer/dist/IEI Timer Faster"
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Version: $VERSION"

          # 计算每个文件的 SHA256
          echo '{' > manifest.json
          echo "  \"version\": \"$VERSION\"," >> manifest.json
          echo '  "files": {' >> manifest.json

          NUM_FILES=0
          for f in $(find "$DIST_DIR" -type f | sort); do
            REL_PATH="${f#$DIST_DIR/}"
            HASH=$(sha256sum "$f" | cut -d' ' -f1)
            if [ $NUM_FILES -gt 0 ]; then
              echo ',' >> manifest.json
            fi
            printf '    "%s": "sha256:%s"' "$REL_PATH" "$HASH" >> manifest.json
            NUM_FILES=$((NUM_FILES + 1))
          done

          echo '' >> manifest.json
          echo '  },' >> manifest.json
          echo "  \"total_files\": $NUM_FILES" >> manifest.json
          echo '}' >> manifest.json
          echo "[OK] manifest.json generated ($NUM_FILES files)"

          # 写入 step output 供后续步骤使用
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build (Inno Setup installer)
        shell: cmd
        run: |
          set /p VERSION=<VERSION
          echo === Building IEI Timer Faster Setup v%VERSION% ===
          set "ISCC="
          if exist "%LOCALAPPDATA%\Programs\Inno Setup 6\ISCC.exe" set "ISCC=%LOCALAPPDATA%\Programs\Inno Setup 6\ISCC.exe"
          if not defined ISCC if exist "%ProgramFiles%\Inno Setup 6\ISCC.exe" set "ISCC=%ProgramFiles%\Inno Setup 6\ISCC.exe"
          if not defined ISCC if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not defined ISCC where iscc 2>nul && set "ISCC=iscc"
          if not defined ISCC (echo [X] ISCC not found & exit /b 1)
          echo [OK] ISCC: %ISCC%
          echo [OK] ISCC flags: /Oservice_installer\dist /FIEI_Timer_Faster_Setup_v%VERSION%
          "%ISCC%" ^
            /Oservice_installer\dist ^
            /FIEI_Timer_Faster_Setup_v%VERSION% ^
            "service_installer\installer\setup.iss" || exit /b %errorlevel%
          echo [OK] ISCC compilation finished
          echo === Verifying output ===
          dir service_installer\dist\IEI_Timer_Faster_Setup*.exe || (
            echo [X] ISCC output not found — listing service_installer\dist for diagnosis
            dir service_installer\dist\*.exe 2>nul || echo "(no .exe files in dist/)"
            dir service_installer\dist 2>nul || echo "(dist/ directory does not exist)"
            exit /b 1
          )

      # =========================================================
      #  INSPUR-103 模块2: 获取上一版本 manifest 并生成增量包
      # =========================================================
      - name: Generate snapshot package
        id: snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Current version: $VERSION"

          # 尝试从最新 GitHub Release 获取上一版本 manifest
          mkdir -p snapshot_work
          PREV_MANIFEST=""
          PREV_VERSION=""

          # 用 GitHub CLI 查询所有 release
          RELEASES_JSON=$(gh api repos/tianlinc/gongshi/releases --jq '.[] | {tag: .tag_name, assets: [.assets[].name]}' 2>/dev/null || echo "")

          # 尝试下载上一个 release 的 manifest.json
          LATEST_RELEASE_TAG=$(gh api repos/tianlinc/gongshi/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -n "$LATEST_RELEASE_TAG" ] && [ "$LATEST_RELEASE_TAG" != "v$VERSION" ]; then
            echo "Latest release tag: $LATEST_RELEASE_TAG"
            PREV_VERSION="${LATEST_RELEASE_TAG#v}"
            echo "Previous version: $PREV_VERSION"

            if gh release download "$LATEST_RELEASE_TAG" -p "manifest.json" -D snapshot_work 2>/dev/null; then
              if [ -f "snapshot_work/manifest.json" ]; then
                PREV_MANIFEST="snapshot_work/manifest.json"
                echo "[OK] Downloaded previous manifest.json from $LATEST_RELEASE_TAG"
              fi
            else
              echo "[!] manifest.json not found in previous release $LATEST_RELEASE_TAG"
            fi
          else
            echo "[!] No previous release found (this may be the first release)"
          fi

          # 如果拿到上一版本 manifest，比对差异并生成增量包
          if [ -n "$PREV_MANIFEST" ] && [ -f "$PREV_MANIFEST" ]; then
            DIST_DIR="service_installer/dist/IEI Timer Faster"

            # 解析 manifest.json 获取文件列表
            # 使用 Python 做 diff（简单可靠）
            python3 - "$PREV_MANIFEST" "manifest.json" "$DIST_DIR" "$VERSION" "$PREV_VERSION" << 'PYEOF'
          import json, os, sys, zipfile, shutil

          prev_mf = sys.argv[1]
          new_mf = sys.argv[2]
          dist_dir = sys.argv[3]
          new_version = sys.argv[4]
          prev_version = sys.argv[5]

          with open(prev_mf) as f:
              prev_data = json.load(f)
          with open(new_mf) as f:
              new_data = json.load(f)

          prev_files = set(prev_data['files'].keys())
          new_files = set(new_data['files'].keys())

          added = new_files - prev_files
          changed = {f for f in (new_files & prev_files) if new_data['files'][f] != prev_data['files'][f]}
          removed = prev_files - new_files

          total = len(new_files)
          change_count = len(added) + len(changed) + len(removed)

          # 降级策略：changed_files > 50%% 不生成增量包
          if len(changed) > total * 0.5:
              print(f"[!] Too many changes ({len(changed)}/{total}), skipping snapshot")
              sys.exit(0)

          print(f"[OK] Added: {len(added)}, Changed: {len(changed)}, Removed: {len(removed)}")

          snapshot_name = f"snapshot_v{prev_version}_{new_version}.zip"
          with zipfile.ZipFile(snapshot_name, 'w', zipfile.ZIP_DEFLATED) as zf:
              # 写入 changed files
              for fname in sorted(changed):
                  local_path = os.path.join(dist_dir, fname)
                  if os.path.isfile(local_path):
                      zf.write(local_path, f"changed_files/{fname}")

              # 写入 added files
              for fname in sorted(added):
                  local_path = os.path.join(dist_dir, fname)
                  if os.path.isfile(local_path):
                      zf.write(local_path, f"added_files/{fname}")

              # 写入 removed.list
              if removed:
                  zf.writestr("removed.list", "\n".join(sorted(removed)))

              # 写入新版本 manifest.json
              zf.writestr("manifest.json", json.dumps(new_data, indent=2))

          print(f"[OK] Snapshot generated: {snapshot_name}")

          # 写入 step output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
              gh_out.write(f"snapshot_name={snapshot_name}\n")
              gh_out.write(f"has_snapshot=true\n")
          PYEOF
          else
            echo "[!] No previous manifest, skipping snapshot generation"
            echo "has_snapshot=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest.json
          path: manifest.json
          if-no-files-found: error

      - name: Upload snapshot artifact
        if: steps.snapshot.outputs.has_snapshot == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-package
          path: snapshot_v*.zip
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: service_installer/dist/IEI_Timer_Faster_Setup*.exe
          if-no-files-found: error

  # ==========================================================
  #  macOS 构建 (仅 tag push 触发)
  # ==========================================================
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r service_installer/requirements.txt pyinstaller

      - name: Prepare icon
        working-directory: service_installer
        continue-on-error: true
        run: |
          if [ -f "iei_timer.icns" ]; then
            echo "icns already exists"
          elif [ -f "iei_timer.ico" ]; then
            python3 _convert_icon.py 2>/dev/null || true
          else
            echo "no .ico file found"
          fi

      - name: Build (PyInstaller)
        working-directory: service_installer
        run: |
          python3 --version
          pip show pyinstaller
          rm -rf dist 2>/dev/null || true
          python3 -m PyInstaller --noconfirm service.spec

      - name: Package (DMG)
        working-directory: service_installer
        run: |
          VERSION=$(cat ../VERSION)
          rm -rf "dist/IEI Timer Faster" 2>/dev/null || true
          if [ -d "dist/IEI Timer Faster.app" ]; then
            hdiutil create -volname "IEI Timer Faster" -srcfolder "dist/IEI Timer Faster.app" -ov -format UDZO "dist/IEI_Timer_Faster_Setup_v${VERSION}.dmg"
            echo "DMG created: dist/IEI_Timer_Faster_Setup_v${VERSION}.dmg"
          else
            echo "ERROR: .app bundle not found at dist/IEI Timer Faster.app/"
            ls -la dist/ 2>/dev/null || echo "(dist/ empty)"
            exit 1
          fi

      - name: Generate appcast.xml
        shell: bash
        run: |
          VERSION=$(cat VERSION)
          DMG_PATH="service_installer/dist/IEI_Timer_Faster_Setup_v${VERSION}.dmg"
          FILE_SIZE=$(stat -f%z "$DMG_PATH" 2>/dev/null || stat -c%s "$DMG_PATH" 2>/dev/null || echo "")
          python3 tools/generate_appcast.py \
            --dmg-url "https://github.com/tianlinc/gongshi/releases/latest/download/IEI_Timer_Faster_Setup_v${VERSION}.dmg" \
            ${FILE_SIZE:+"--file-size" "$FILE_SIZE"} \
            --output appcast.xml
          echo "[OK] appcast.xml generated"
          cat appcast.xml

      - name: Upload appcast.xml
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: appcast.xml
          if-no-files-found: error

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: service_installer/dist/IEI_Timer_Faster_Setup_*.dmg
          if-no-files-found: error

  # ==========================================================
  #  部署 appcast.xml 到 GitHub Pages (仅 tag push 触发)
  # ==========================================================
  deploy-pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appcast.xml
          path: ./appcast

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appcast
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'deploy: update appcast.xml to ${{ github.ref_name }}'

  # ==========================================================
  #  自动创建 GitHub Release 并上传未压缩产物
  #  INSPUR-103 模块4: channel 检测（beta/stable/security）
  # ==========================================================
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: ./release

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: manifest.json
          path: ./release

      - name: Download snapshot artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: snapshot-package
          path: ./release

      # =========================================================
      #  INSPUR-103 模块4: 检测 release channel
      #  - v1.1.22-beta tag → beta channel
      #  - v1.1.22 tag → stable channel
      #  - label_security → security (force_update)
      # =========================================================
      - name: Detect release channel
        id: channel
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          CHANNEL="stable"
          IS_SECURITY="false"

          if [[ "$TAG" =~ -beta$ ]]; then
            CHANNEL="beta"
          fi

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "is_security=$IS_SECURITY" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Channel: $CHANNEL, Security: $IS_SECURITY"

      - name: Compute base_versions (last 3 releases)
        id: base_versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          echo "Current: $CURRENT_TAG"

          # 获取最近 4 个 release（包含当前构建的版本，跳过它）
          TAGS=$(gh api repos/tianlinc/gongshi/releases --jq '.[].tag_name' 2>/dev/null | head -4 | grep -v "$CURRENT_TAG" | head -3)
          BASE_LIST="[]"
          if [ -n "$TAGS" ]; then
            BASE_LIST=$(echo "$TAGS" | sed 's/^v//' | awk '{printf "\"%s\"", $0}' | paste -sd,)
            BASE_LIST="[$BASE_LIST]"
          fi
          echo "Base versions: $BASE_LIST"
          echo "base_versions=$BASE_LIST" >> $GITHUB_OUTPUT

      - name: Generate release_info.json
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          CHANNEL="${{ steps.channel.outputs.channel }}"
          IS_SECURITY="${{ steps.channel.outputs.is_security }}"
          BASE_VERSIONS='${{ steps.base_versions.outputs.base_versions }}'
          TAG="${{ github.ref_name }}"

          printf '{\n' > release_info.json
          printf '  "version": "%s",\n' "$VERSION" >> release_info.json
          printf '  "tag": "%s",\n' "$TAG" >> release_info.json
          printf '  "channel": "%s",\n' "$CHANNEL" >> release_info.json
          printf '  "force_update": %s,\n' "$IS_SECURITY" >> release_info.json
          printf '  "base_versions": %s\n' "$BASE_VERSIONS" >> release_info.json
          printf '}\n' >> release_info.json
          echo "[OK] release_info.json generated"
          cat release_info.json
          cp release_info.json ./release/

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          set -x
          pwd
          ls -la RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          content=$(<RELEASE_NOTES.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "::notice::Release notes loaded (${#content} chars)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            ./release/IEI_Timer_Faster_Setup*.exe
            ./release/IEI_Timer_Faster_Setup_*.dmg
            ./release/manifest.json
            ./release/release_info.json
            ./release/snapshot_v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
